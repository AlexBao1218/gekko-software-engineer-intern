# Minimal starting point — extend it, don't blindly copy it.
# Think about: trailing-slash semantics of proxy_pass, client_max_body_size
# (batch CSVs exceed nginx's 1MB default), proxy_read_timeout.
server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8000;
    }

    location /ocr/ {
        proxy_pass http://mock_ocr:9100;
    }
}
