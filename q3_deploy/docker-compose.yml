services:
  api:
    build:
      context: ..
      dockerfile: q3_deploy/Dockerfile
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/data/app.db}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_TIMEOUT_SECONDS: ${BACKUP_TIMEOUT_SECONDS:-30}
      SEED_CSV_PATH: ${SEED_CSV_PATH:-/srv/data/account_applications.csv}
      OCR_URL: ${OCR_URL:-http://mock_ocr:9100/ocr/parse}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-1}
      OCR_MAX_ATTEMPTS: ${OCR_MAX_ATTEMPTS:-6}
      OCR_BACKOFF_SECONDS: ${OCR_BACKOFF_SECONDS:-0.1}
      OCR_BACKOFF_CAP_SECONDS: ${OCR_BACKOFF_CAP_SECONDS:-0.5}
      DELIVERY_URL: ${DELIVERY_URL:-http://mock_onboarding:9200/ingest}
      DELIVERY_TIMEOUT_SECONDS: ${DELIVERY_TIMEOUT_SECONDS:-1}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-4}
      DELIVERY_BACKOFF_SECONDS: ${DELIVERY_BACKOFF_SECONDS:-0.1}
      DELIVERY_BACKOFF_CAP_SECONDS: ${DELIVERY_BACKOFF_CAP_SECONDS:-0.5}
    volumes:
      - api_data:/data
      - api_backups:/backups
    depends_on:
      mock_ocr:
        condition: service_healthy
      mock_onboarding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s

  mock_ocr:
    build: ../mock_ocr
    environment:
      OCR_FAIL_RATE: ${OCR_FAIL_RATE:-0.2}
      OCR_HANG_RATE: ${OCR_HANG_RATE:-0.1}
      OCR_HANG_SECONDS: ${OCR_HANG_SECONDS:-600}
      OCR_SEED: ${OCR_SEED:-42}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/online', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  mock_onboarding:
    build: ../mock_onboarding
    environment:
      ONBOARDING_FAIL_RATE: ${ONBOARDING_FAIL_RATE:-0.2}
      ONBOARDING_LOST_RATE: ${ONBOARDING_LOST_RATE:-0.15}
      ONBOARDING_LOST_SECONDS: ${ONBOARDING_LOST_SECONDS:-120}
      ONBOARDING_SEED: ${ONBOARDING_SEED:-7}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/online', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      mock_ocr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "2", "http://127.0.0.1/api/ready"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  api_data:
  api_backups:
